# iShare — example coturn configuration.
# Copy to /etc/turnserver.conf and replace every CHANGE_ME value.
# Documented in README.md → "TURN yapılandırması".

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech

# A realm does not need to match the app domain, but must be stable.
realm=turn.example.com

# RECOMMENDED: short-lived credentials (coturn "TURN REST API").
# Set the same value as TURN_SECRET on the Node.js server and remove the
# `user=` line below. The app signs a fresh username/credential pair for every
# browser and the shared secret never leaves the server.
# use-auth-secret
# static-auth-secret=CHANGE_ME_LONG_RANDOM_SECRET

# Simple alternative: one static username/password pair.
user=ishare:CHANGE_ME_STRONG_PASSWORD

# Public IP of the TURN host (not the private LAN address).
external-ip=CHANGE_ME_PUBLIC_IP

min-port=49152
max-port=65535

# Limits abuse if the credentials leak.
total-quota=100
bps-capacity=0
stale-nonce=600
no-multicast-peers
no-cli
no-loopback-peers

# TLS: uncomment and point to your certificate (required for turns:).
# cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem
